<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Turtle Blockly</title>
    <style>
      :root {
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: #153243;
        background: linear-gradient(180deg, #f8fbff 0%, #eaf4f1 100%);
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        display: grid;
        grid-template-columns: minmax(360px, 1.2fr) minmax(320px, 0.8fr);
        gap: 20px;
        padding: 20px;
      }

      .panel {
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(21, 50, 67, 0.12);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(21, 50, 67, 0.08);
        overflow: hidden;
      }

      .panel-header {
        padding: 16px 18px 10px;
      }

      .panel-header h1,
      .panel-header h2 {
        margin: 0;
      }

      .panel-header p {
        margin: 6px 0 0;
        color: #46606d;
      }

      #blocklyDiv {
        height: 560px;
        width: 100%;
      }

      .controls {
        display: flex;
        gap: 12px;
        padding: 0 18px 18px;
      }

      .code-panel {
        padding: 0 18px 18px;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
        background: #14866d;
        color: #ffffff;
      }

      button.secondary {
        background: #153243;
      }

      #simulatorCanvas {
        display: block;
        width: calc(100% - 36px);
        margin: 0 18px 18px;
        border-radius: 12px;
        border: 1px solid rgba(21, 50, 67, 0.18);
        background: #ffffff;
      }

      #codeOutput {
        padding: 15px;
        border-radius: 12px;
        background: #0f1f2b;
        color: #d2f9e9;
        font-family: Consolas, monospace;
        white-space: pre-wrap;
        min-height: 180px;
        overflow: auto;
      }

      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }

        #blocklyDiv {
          height: 440px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <div class="panel-header">
          <h1>Turtle Workspace</h1>
          <p>Compose turtle commands and generate runnable JavaScript.</p>
        </div>
        <div id="blocklyDiv"></div>
        <div class="controls">
          <button id="generateBtn" class="secondary">Generate JavaScript</button>
          <button id="runBtn">Run Program</button>
        </div>
        <div class="code-panel">
          <pre id="codeOutput">Generated JavaScript will appear here...</pre>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Simulator</h2>
          <p>The turtle starts in the center, facing right, drawing a black trail when the pen is down.</p>
        </div>
        <canvas id="simulatorCanvas" width="480" height="480"></canvas>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
